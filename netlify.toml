[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[[redirects]]
  from = "/insurance-details"
  to = "/insurance.html"
  status = 301

[[redirects]]
  from = "/insurance-details.html"
  to = "/insurance.html"
  status = 301
